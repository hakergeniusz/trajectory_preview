[mod]
id = "trajectory_preview"
version = "0.2.1"
priority = 100

# The commit it was tested on: the tick hook simulates the held projectile
# with the game's own ProjWorld/ArrowScene (game/creatures.rs, game.rs) and
# the frame hook draws into the gizmo lines (game/native_visuals.rs), so a
# Horizon change in any of those sources needs a re-check.
[compatibility]
horizon_revision = "2ebf00a0281c592f79191e76fce0e7d522c6f425"

# The mod's brain: pure standard library, no game types, tested on its own —
# the shot table (the bow's draw curve, the trident's gate, the throwables'
# speeds and offsets).
[[module]]
id = "runtime"
file = "crates/horizon-client/src/game.rs"
name = "trajectory_preview"
source = "runtime.rs"

# The published preview of the latest tick and its line building.
[[module]]
id = "state"
file = "crates/horizon-client/src/game.rs"
name = "trajectory_state"
source = "state.rs"

# The game-side simulation: one flight of the held projectile, stepped with
# the game's own tick against the live world.
[[module]]
id = "sim"
file = "crates/horizon-client/src/game.rs"
name = "trajectory_sim"
source = "sim.rs"

# Every game tick: simulate what the hand holds and publish the flight.
[[injection]]
id = "tick"
kind = "HEAD"
target = "horizon_client::game::native_hooks::Game<'_>::native_tick"
helper = "tick.rs"
bindings = [
  { name = "game", ty = "&mut crate::game::Game<'_>", value = "&mut *self" },
]

# Every frame: the published flight joins the depth-tested gizmo lines.
[[injection]]
id = "frame"
kind = "HEAD"
target = "horizon_client::game::native_visuals::Game<'_>::native_frame_visuals"
helper = "frame.rs"
bindings = [
  { name = "game", ty = "&crate::game::Game<'_>", value = "self" },
  { name = "lines", ty = "&mut Vec<horizon_client::gizmos::Line>", value = "lines" },
]

# The row in Options > Mods: the mod and what it does.
[[injection]]
id = "list"
kind = "HEAD"
target = "horizon_client::game::native_hooks::Game<'_>::native_mods"
helper = "list.rs"
bindings = [
  { name = "mods", ty = "&mut Vec<crate::game::native_hooks::NativeMod>", value = "&mut *mods" },
]
